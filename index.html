<!DOCTYPE html>
<html lang="pt-BR" style="--brand: #803333; --accent: #ff3300;"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1F6B4A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Clube Manager">
<meta name="format-detection" content="telephone=no">
<title>Clube Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2EF;--surface:#FFFFFF;--ink:#14231C;--mute:#5E7267;--line:#D7E0DA;--brand:#1F6B4A;--brand-ink:#FFFFFF;--accent:#E8B923;--yellow:#F5C518;--pos:#1F8A55;--neg:#C0392B;--soft:#E5EDE8;
--fh:'Barlow Condensed','Arial Narrow',sans-serif;--fb:'Barlow',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1712;--surface:#15231C;--ink:#E6EFE9;--mute:#8FA598;--line:#25382E;--soft:#1C2E25;--pos:#3DBE82;--neg:#EF6B5B}}
:root[data-theme="dark"]{--bg:#0D1712;--surface:#15231C;--ink:#E6EFE9;--mute:#8FA598;--line:#25382E;--soft:#1C2E25;--pos:#3DBE82;--neg:#EF6B5B}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--fb)}
h1,h2,h3{font-family:var(--fh);font-weight:600;margin:0;letter-spacing:.2px}
h1{font-size:30px}h2{font-size:22px}h3{font-size:18px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;min-height:100vh}
aside{width:236px;background:var(--brand);color:var(--brand-ink);padding:18px 12px;position:sticky;top:0;height:100vh;display:none;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.shield{width:38px;height:44px;background:var(--accent);color:#1b1b1b;font:700 20px var(--fh);display:grid;place-items:center;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}
.brand b{font:600 20px/1.05 var(--fh)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:inherit;text-decoration:none;opacity:.82;cursor:pointer}
.nav a:hover{opacity:1;background:rgba(255,255,255,.1)}
.nav a.on{opacity:1;background:rgba(255,255,255,.18);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
main{flex:1;min-width:0;padding:16px 14px 92px;max-width:1180px;margin:0 auto;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:4px;cursor:pointer;text-decoration:none}
.bottom a.on{color:var(--brand)}.bottom svg{width:22px;height:22px}
@media(min-width:900px){aside{display:flex}.bottom{display:none}main{padding:24px 28px 40px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr 1fr}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.kpi small{color:var(--mute);display:block}
.kpi b{font:600 30px/1.1 var(--fh);display:block;margin-top:2px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mute{color:var(--mute)}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:9px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;white-space:nowrap}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-weight:500;color:var(--mute);text-align:left;font-size:13px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.wrap{overflow-x:auto}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--soft)}
.tag.ok{background:#1F8A5522;color:var(--pos)}.tag.bad{background:#C0392B22;color:var(--neg)}.tag.warn{background:#E8B92333;color:#9a7500}
:root[data-theme="dark"] .tag.warn{color:var(--accent)}
.pitch{background:var(--brand);color:#fff;border-radius:14px;padding:18px;position:relative;overflow:hidden}
.pitch svg{position:absolute;inset:0;width:100%;height:100%;opacity:.16}
.pitch>*{position:relative}
.pitch .vs{font:600 34px/1 var(--fh)}
.score{font:700 44px/1 var(--fh)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.ev{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ev .min{font:600 18px var(--fh);width:36px;color:var(--mute)}
.dot{width:12px;height:16px;border-radius:2px;display:inline-block;vertical-align:-2px}.dot.y{background:var(--yellow)}.dot.r{background:var(--neg)}
.lnk{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}.toast.show{opacity:1}
.kpi b.nm{font-size:24px;line-height:1.15;overflow-wrap:anywhere}.kpi small.sub{margin-top:2px;font-size:13px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input[type=number]{width:64px;padding:5px 6px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);width:min(440px,92vw);padding:18px}
dialog::backdrop{background:#0008}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{min-height:58px;border:1px solid var(--line);border-radius:8px;padding:3px 5px;font-size:12px;background:var(--surface);overflow:hidden}
.cal .h{min-height:0;border:0;background:none;color:var(--mute);text-align:center}
.cal .today{border-color:var(--accent);border-width:2px}
.chip{display:block;border-radius:4px;padding:1px 4px;margin-top:2px;font-size:11px;color:#fff;background:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.p{background:var(--accent);color:#222}
.chip.cursor{padding:3px 5px}.chip.cursor:hover{filter:brightness(1.12)}
.mcard{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.cursor{cursor:pointer}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card.cursor:hover{border-color:var(--brand)}}
.kan{display:flex;gap:10px;min-width:max-content}.kan .col{width:230px;background:var(--soft);border-radius:12px;padding:10px}
aside select{font-size:14px}dialog{max-height:90vh;overflow:auto}
table input[type=checkbox]{width:auto}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:13px}.pill.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.vsrow{display:flex;align-items:center;justify-content:center;gap:14px}.vsrow .x{font:600 28px var(--fh);opacity:.8}.vsrow>div{text-align:center;min-width:0}.vsrow b{display:block;font:600 18px/1.1 var(--fh)}
.bn{position:sticky;top:0;z-index:4;background:var(--accent);color:#222;padding:8px 12px;border-radius:10px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media(max-width:640px){select.fin-f{flex:1 1 100%;width:100%!important}}
/* bloco esportivo: linguagem única (claro, borda discreta, accent = cor do clube) */
.sx{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.sx-h{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.sx-h i{font-style:normal;color:var(--brand)}
.sx-vs{display:flex;align-items:flex-start;justify-content:center;gap:12px;margin:18px 0 14px}
.sx-vs>div{flex:1;text-align:center;min-width:0}.sx-vs>div b{display:block;margin-top:8px;font-size:14px;overflow-wrap:anywhere}
.sx-vs .x{flex:none;font:600 26px var(--fh);color:var(--mute);align-self:center;margin-top:-18px}
.sx-vs .score{flex:none;align-self:center;margin-top:-18px}
.sx-meta{text-align:center;font-size:14px;line-height:1.6}.sx-meta b{font-size:15px}
.sx-hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.sx-ft{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.sx-cmp{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:640px){.sx-ft .btn{flex:1 1 100%}}
/* card Próximo jogo: campo de futebol em CSS puro (sem imagem), responsivo e sem distorção */
.nx-field{position:relative;overflow:hidden;border-radius:12px;margin-top:14px;padding:22px 12px 18px;color:#fff;isolation:isolate;background:repeating-linear-gradient(90deg,#2e8b4b 0 12.5%,#369a55 12.5% 25%)}
.nx-field>i{position:absolute;pointer-events:none;box-sizing:border-box;border:2px solid rgba(255,255,255,.42);z-index:0}
.nx-field .fb{inset:8px;border-radius:3px}
.nx-field .fm{top:8px;bottom:8px;left:50%;width:0;border-width:0 0 0 2px;margin-left:-1px}
.nx-field .fc{top:50%;left:50%;height:44%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
.nx-field .fd{top:50%;left:50%;width:6px;height:6px;border:0;border-radius:50%;background:rgba(255,255,255,.55);transform:translate(-50%,-50%)}
.nx-field .fa{top:50%;height:56%;width:15%;transform:translateY(-50%)}
.nx-field .fa.l{left:8px;border-left:0}.nx-field .fa.r{right:8px;border-right:0}
.nx-field .fg{top:50%;height:28%;width:6%;transform:translateY(-50%)}
.nx-field .fg.l{left:8px;border-left:0}.nx-field .fg.r{right:8px;border-right:0}
.nx-in{position:relative;z-index:1}
.nx-vs{display:flex;align-items:center;justify-content:center;gap:10px}
.nx-vs>div{flex:1;min-width:0;text-align:center}
.nx-vs>div b{display:block;margin-top:6px;font:700 18px/1.1 var(--fh);text-transform:uppercase;letter-spacing:.03em;overflow-wrap:anywhere;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.nx-vs .x{flex:none;font:600 28px var(--fh);color:#fff;opacity:.92;margin-top:-16px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.nx-meta{display:grid;grid-template-columns:repeat(2,minmax(0,auto));justify-content:center;gap:4px 28px;width:fit-content;max-width:100%;margin:16px auto 0;padding:8px 16px;border-radius:10px;background:rgba(0,0,0,.3);font-size:14px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.nx-meta span{min-width:0;overflow-wrap:anywhere}
.nx-conv{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--soft)}
.nx-conv small{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.nx-chips{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:14px;font-weight:600}
.nx-chips span{white-space:nowrap}
.sx-ft.nx-ft{margin-top:12px}.sx-ft.nx-ft .btn{flex:1 1 100%}

.camp-g{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px}
.camp-g>div{background:var(--surface);padding:14px 14px}.camp-g small{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.camp-g b{display:block;margin-top:6px;font:700 26px/1.1 var(--fh)}.camp-g .cursor:hover{background:var(--soft)}
.grid>*{min-width:0}.kpi b{overflow-wrap:break-word}
/* estatísticas + calendário */
.rk-f>summary{display:none;list-style:none}.rk-f>summary::-webkit-details-marker{display:none}
.rk-p{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.rk-t{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:center;min-width:0}
.rk-t{padding:0;overflow:hidden;gap:0;border-width:1.5px;border-color:var(--rk-c)}
.rk-g1{--rk-c:#C9A227;--rk-c2:#F3DC83;--rk-ink:#4A3A00}.rk-g2{--rk-c:#8E9BA5;--rk-c2:#DDE3E8;--rk-ink:#2B343B}.rk-g3{--rk-c:#B0723B;--rk-c2:#E8BE95;--rk-ink:#4A2B0E}
.rk-h{align-self:stretch;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 10px;background:linear-gradient(135deg,var(--rk-c2),var(--rk-c));color:var(--rk-ink)}
.rk-mi{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:18px;line-height:1;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1.5px var(--rk-c);flex:none}
.rk-pos{font:700 18px/1 var(--fh);letter-spacing:.08em}
.rk-ti{align-self:stretch;text-align:center;padding:8px 10px 0;font:600 13px/1.2 var(--fh);letter-spacing:.1em;color:var(--rk-c)}
.rk-bd{align-self:stretch;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 12px 16px;text-align:center;min-width:0;flex:1}
.rk-i{display:flex;flex-direction:column;align-items:center;min-width:0;max-width:100%}
.rk-n{font:700 20px/1.15 var(--fh);text-transform:uppercase;overflow-wrap:anywhere}.rk-ps{font-size:14px;color:var(--mute);min-height:1.4em}
.rk-vl{margin-top:6px;display:flex;align-items:baseline;justify-content:center;gap:6px;flex-wrap:wrap}.rk-u{font:700 15px/1 var(--fh);letter-spacing:.06em;color:var(--rk-c)}
.rk-v{font:700 34px/1 var(--fh)}.rk-t b{overflow-wrap:break-word}.rk-sb{font-size:13px;overflow-wrap:anywhere}
.dc-gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px}.dc-it{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);min-width:0}.dc-it span{overflow-wrap:anywhere}.dc-bt{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:12px}
.cal{gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal div{border:0;border-radius:0;min-height:88px;padding:6px;font-size:13px}.cal div:not(.h):hover{background:var(--soft)}
.cal .h{background:var(--surface);padding:8px 0;font-size:11px;font-weight:600;letter-spacing:.08em}
.cal .today{box-shadow:inset 0 0 0 2px var(--brand)}.cal .today>b{background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:1px 7px}
.chip{border-radius:6px}.chip.p{background:#C0392B1f;color:var(--neg);border:1px solid #C0392B55}
.wd-s{display:none}.cal-n{min-width:36px;font-size:18px;line-height:1;padding:6px 10px}
@media(max-width:640px){.rk-f>summary{display:inline-block;margin-bottom:8px}.rk-p{grid-template-columns:1fr}.rk-bd{flex-direction:row;text-align:left;align-items:center;gap:12px;flex-wrap:wrap}.rk-i{align-items:flex-start;flex:1 1 120px}.rk-vl{margin-top:0;justify-content:flex-start}.rk-bd>.rk-st{flex:1 1 100%;text-align:left}.dc-bt .btn{flex:1 1 100%;text-align:center}.wd-f{display:none}.wd-s{display:inline}.cal div{min-height:54px;padding:3px}.chip{font-size:10px;padding:2px 3px}}
.tag.org{background:#F2994A33;color:#B55F0B}.tag.yel{background:#F5C51833;color:#8a6d00}.tag.neu{background:var(--soft);color:var(--mute)}
.chip .l1{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis}.chip .l2{display:block;font-size:10px;opacity:.85;overflow:hidden;text-overflow:ellipsis}
.rk-m{position:relative}.rk-m summary{list-style:none;cursor:pointer;padding:2px 10px;border-radius:8px;font-size:20px;line-height:1;color:var(--mute)}.rk-m summary::-webkit-details-marker{display:none}.rk-m>div{position:absolute;right:0;top:100%;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;min-width:180px}.rk-m button{display:block;width:100%;text-align:left;margin:2px 0}
.gk-w{display:flex;align-items:flex-end;justify-content:center;gap:12px;flex-wrap:wrap}.gk{text-align:center;min-width:0}.gk b{display:block;overflow-wrap:break-word}.gk-c{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}.gk-b{min-width:46px;height:46px;padding:0;font-size:24px;line-height:1}
@media(max-width:640px){.camp-g{grid-template-columns:1fr 1fr}.camp-g b{font-size:24px}}

/* disponibilidade / documentação (ajuste pontual) */
.av-d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--mute)}
.pd{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin-bottom:14px}
.pd-i{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:center;cursor:pointer;min-width:0}
.pd1{padding-top:22px;padding-bottom:22px;border-color:var(--accent)}.pd-m{font-size:26px;line-height:1}
.pd-n{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.pd-s{font:700 22px/1 var(--fh)}
@media(max-width:480px){.pd{gap:6px}.pd-i{padding:10px 4px}.pd-n{font-size:12px;white-space:normal;overflow-wrap:anywhere}.pd-s{font-size:18px}}
.rs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.rs-c{display:flex;flex-direction:column;gap:4px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.rs-c b{font:700 24px/1 var(--fh)}
.dt-h{margin:14px 0 8px;font-size:12px;letter-spacing:.08em;color:var(--mute)}
.dt-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px 10px}.dt-s{display:flex;flex-direction:column;font-size:14px}.dt-s small{font-size:11px}
.nopt .pd-i{cursor:default}.pd-l{margin-top:4px;font-size:10px;letter-spacing:.06em;color:var(--mute)}.pd-i small{max-width:100%;overflow-wrap:anywhere}
@media(max-width:600px){.rs{grid-template-columns:1fr 1fr}}
.qe-row{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--surface);position:relative;-webkit-user-select:none;user-select:none}
.qe-h{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--mute);cursor:grab;touch-action:none;border-radius:8px}
.qe-h:active,.qe-h:focus-visible{background:var(--soft);cursor:grabbing}
.qe-row input.qe-n{width:68px;flex:none;text-align:center;-webkit-user-select:text;user-select:text}
.qe-row.drag{opacity:.5;background:var(--soft)}
.qe-row.dt::before,.qe-row.db::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--brand);z-index:2}
.qe-row.dt::before{top:-2px}.qe-row.db::after{bottom:-2px}
body.qe-drag,body.qe-drag *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}

.cp-hl{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);min-width:0}.cp-hl .cp-l{margin-bottom:2px}.cp-hl b{display:block;font:600 18px/1.2 var(--fh);overflow-wrap:anywhere}.cp-hl small.mute{display:block;margin-top:2px}.cp-hl.cursor:hover b{color:var(--brand)}

.cp-nm{row-gap:10px}.cp-ni+.cp-ni{border-left:0}.cp-k b{font-size:22px}.cp-ni b{font-size:20px}

/* ===== Responsividade geral (camada fluida; só CSS, sem alterar lógica) ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-wrap:break-word}
img,svg,video,canvas{max-width:100%}
img{height:auto}
h1{font-size:clamp(23px,4.6vw + 6px,32px);overflow-wrap:anywhere}
h2{font-size:clamp(19px,2.4vw + 11px,24px);overflow-wrap:anywhere}
h3{overflow-wrap:anywhere}
.top h1{min-width:0}
.top>.row{min-width:0}
aside{width:clamp(208px,19vw,252px);height:100vh;height:100dvh}
main{padding:clamp(12px,3vw,24px) clamp(10px,3vw,28px) calc(92px + env(safe-area-inset-bottom,0px))}
@media(min-width:900px){main{padding:clamp(18px,2vw,30px) clamp(20px,2.6vw,40px) 40px}}
@media(min-width:1600px){main{max-width:1360px}}
@media(min-width:2200px){main{max-width:1560px}}
.card{min-width:0}
.card,.pitch,.sx{overflow-wrap:break-word}
.kpi b{font-size:clamp(18px,5.4vw + 1px,30px)}
.kpi b.nm{font-size:clamp(17px,3vw + 8px,24px)}
@media(max-width:400px){.card.kpi{padding:12px 10px}}
.score{font-size:clamp(32px,9vw,44px)}
.pitch .vs{font-size:clamp(24px,7vw,34px)}
.pitch{padding:clamp(12px,3.4vw,18px)}
.row>*{min-width:0}
.row .btn,.top .btn{max-width:100%}
/* tabs: rolagem só dentro da faixa de abas */
.tabs{max-width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tabs button{flex:none}
/* tabelas: rolagem horizontal só dentro do componente */
.wrap{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl td,.tbl th{vertical-align:middle}
.tbl td .btn,.tbl td select{white-space:nowrap}
/* formulários */
input,select,textarea{min-width:0;max-width:100%}
input[type=date],input[type=time],input[type=month]{min-width:0}
@media(pointer:coarse){input,select,textarea{font-size:16px}.btn,.pill,.tabs button{min-height:40px}.btn.sm{min-height:36px}}
/* modais */
dialog{width:min(480px,calc(100vw - 24px));max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow-y:auto;overflow-x:hidden;padding:clamp(14px,3.4vw,20px);margin:auto;overscroll-behavior:contain}
dialog img,dialog iframe,dialog embed,dialog object,dialog video{max-width:100%}
dialog .row{flex-wrap:wrap}
dialog .row .btn{flex:1 1 auto}
/* filtro de período (Estatísticas/Ranking): permitir quebra, mesmo com style inline */
.rk-f .row{flex-wrap:wrap!important}
.rk-f input[type=date]{width:auto!important;flex:1 1 130px;min-width:0}
.rk-f .card.row>*{min-width:0}
/* barra inferior */
.bottom{padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.bottom a{min-width:0;justify-content:center;text-align:center;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bottom a svg{flex:none}
@media(max-width:360px){.bottom a{font-size:10px;padding:4px 2px}.bottom svg{width:20px;height:20px}}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media(min-width:900px){.toast{bottom:24px}}
/* escudos e fotos sem deformar */
.shield,.pm-sh,.sx-vs img,.nx-vs img,.vsrow img,.cp-one img,.brand img{object-fit:contain;max-width:100%}
/* destaques (artilheiro, MVP, cartões...): avatar + nome nunca quebram letra a letra */
.kpi b>span[style*="align-items:center"]{flex-wrap:wrap;row-gap:4px;max-width:100%}
.kpi b>span[style*="align-items:center"]>span:last-child{min-width:0;overflow-wrap:break-word}
.sx{padding:clamp(12px,4vw,18px)}
@media(max-width:400px){
.camp-g>div{padding:12px 10px}
.camp-g small{font-size:10px;letter-spacing:.03em;overflow-wrap:normal}
.camp-g b{font-size:clamp(20px,7vw,24px)}
}
/* Partidas (mobile): confronto compacto lado a lado -> ver bloco "Mobile compacto" no fim do CSS */
@media(max-width:640px){
.pm-top{justify-content:space-between}
.pm-ft{justify-content:space-between}
}
/* dica visual de rolagem horizontal dentro de tabelas (sombra nas bordas) */
.card.wrap{background:linear-gradient(to right,var(--surface),var(--surface)) left center/18px 100% no-repeat local,linear-gradient(to left,var(--surface),var(--surface)) right center/18px 100% no-repeat local,linear-gradient(to right,rgba(0,0,0,.16),rgba(0,0,0,0)) left center/10px 100% no-repeat scroll,linear-gradient(to left,rgba(0,0,0,.16),rgba(0,0,0,0)) right center/10px 100% no-repeat scroll,var(--surface)}
/* Campanha: rótulos dos KPIs sem quebrar no meio da palavra */
@media(max-width:480px){.cp-kl{font-size:10px!important;letter-spacing:.02em;overflow-wrap:normal}.cp-k{padding:10px}}
/* Perfil do jogador (mobile): bloco de status/nota desce e alinha à esquerda */
@media(max-width:480px){
.card.row>.sp+div[style*="text-align:right"]{flex:1 1 100%;text-align:left!important;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.card.row>.sp+div[style*="text-align:right"]>div{margin-top:0!important}
}
/* tabelas fora de .wrap (ex.: Ranking Geral) rolam dentro do próprio card em telas estreitas */
@media(max-width:640px){.card:not(.wrap)>table.tbl{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}}
/* grids com cards de conteúdo (não KPIs) caem para 1 coluna em telas estreitas */
@media(max-width:560px){.grid.g3:has(>.card:not(.kpi)),.grid.g4:has(>.card:not(.kpi)){grid-template-columns:minmax(0,1fr)}}

/* =====================================================================
   REVISÃO MOBILE / RESPONSIVIDADE (camada global e reutilizável)
   Breakpoints: ≤374 celular pequeno · 375–430 comum · 431–767 largo · 768–1023 tablet · 1024+ desktop
   ===================================================================== */
:root{--tap:44px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html{overflow-x:clip}body{overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,summary,a{touch-action:manipulation}
.cq{container-type:inline-size;min-width:0}
/* --- Menu "Mais" --- */
.mn-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:10px}
.mn-t{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;padding:12px 8px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;font-weight:600;font-size:14px;line-height:1.15;text-align:center;min-width:0}
.mn-t svg{width:26px;height:26px;flex:none;color:var(--brand)}
.mn-t span{min-width:0;overflow-wrap:break-word}
.mn-t:active{background:var(--soft)}
.mn-sw select{width:100%}
/* --- Menus "Mais opções" (details) --- */
.mo{position:relative;flex:1 1 0;min-width:0}
.mo>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:center;width:100%;min-height:var(--tap);text-align:center}
.mo>summary::-webkit-details-marker{display:none}
.mo-m{position:absolute;right:0;bottom:calc(100% + 6px);z-index:8;width:max-content;min-width:min(220px,calc(100vw - 32px));max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.mo-m .btn,.mo-m select{width:100%;min-height:var(--tap);max-width:none}
.mo-l{margin:0;font-size:12px}
/* --- Cards de jogador (Elenco) e de lançamento (Financeiro): lista por padrão; tabela só quando o contêiner é largo --- */
.pl-tbl,.tx-tbl,.perm-tbl{display:none}
.pl-list,.tx-list{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@container (min-width:560px){.pl-list,.tx-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:900px){.pl-list{display:none}.pl-tbl{display:block}}
@container (min-width:760px){.tx-list{display:none}.tx-tbl{display:block}}
@container (min-width:860px){.perm-list{display:none}.perm-tbl{display:block}}
.pc,.tc{padding:12px;min-width:0}
.pc{display:grid;gap:10px;align-content:start}
.pc-main{display:flex;gap:12px;align-items:center;min-width:0;border-radius:10px}
.pc-id{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.pc-n{font:600 18px/1.15 var(--fh);overflow-wrap:break-word;word-break:normal;min-width:0;max-width:100%}
.pc-s{color:var(--mute);font-size:13px}
.pc-st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:8px;background:var(--soft);border-radius:10px}
.pc-st>div{text-align:center;min-width:0}.pc-st small{display:block;font-size:11px;color:var(--mute);white-space:nowrap}.pc-st b{font:700 18px/1.1 var(--fh)}
.pc-act,.tc-act{display:flex;gap:8px;align-items:stretch}
.pc-act>.btn,.tc-act>.btn{flex:1 1 0;min-height:var(--tap)}
.tc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-content:start}
.tc-top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.tc-d{grid-column:1;font-weight:600;overflow-wrap:anywhere}
.tc-c{grid-column:1;font-size:13px}
.tc-v{grid-column:2;grid-row:2/4;align-self:center;font:700 22px/1 var(--fh);white-space:nowrap}
.tc-act{grid-column:1/-1;margin-top:10px}
.tc.off{opacity:.65}.tc.off .tc-d{text-decoration:line-through}
.tg-btn{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:600}
/* --- Filtros recolhíveis (painel "Filtros" no celular) --- */
.flt{margin-bottom:10px}
.flt>summary{display:none;list-style:none;cursor:pointer}.flt>summary::-webkit-details-marker{display:none}
.flt-b{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flt-b select{flex:1 1 170px;width:auto!important;min-width:0}
/* --- Permissões: accordion no celular --- */
.perm-list{display:grid;gap:8px}
.pa{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.pa>summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:var(--tap);padding:8px 14px;cursor:pointer;font-size:16px}
.pa>summary::-webkit-details-marker{display:none}
.pa>summary::after{content:"▾";margin-left:auto;color:var(--mute);transition:transform .15s}.pa[open]>summary::after{transform:rotate(180deg)}
.pa-c{font-size:12px}
.pa-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));border-top:1px solid var(--line)}
.pa-i{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0;padding:6px 14px;min-height:48px;color:var(--ink);font-size:15px;border-bottom:1px solid var(--line)}
.pa-i input{width:24px!important;height:24px;flex:none;padding:0}

/* --- Permissões por ação --- */
.prm-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.prm-head select{width:min(280px,100%);margin-top:4px}
.prm-badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}
.prm-badge.full{background:var(--soft)}
.prm-grid{overflow:auto;border:1px solid var(--line);border-radius:12px}
.prm-grid table{margin:0;min-width:650px}
.prm-grid th:not(:first-child),.prm-grid td:not(:first-child){text-align:center}
.prm-grid input[type=checkbox]{width:20px!important;height:20px;padding:0}
.prm-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.prm-note{font-size:12px;color:var(--mute)}
.ro-locked{opacity:.45!important;cursor:not-allowed!important;filter:grayscale(.2)}
.ro-mode{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media(max-width:640px){.prm-head{align-items:stretch}.prm-head>div,.prm-head select{width:100%}.prm-head>div[style*="grid-template-columns"]{grid-template-columns:1fr!important;min-width:0!important}.prm-actions .btn{width:100%}}

/* --- Modais: título e ações sempre visíveis; bottom sheet no celular --- */
dialog{--dp:clamp(14px,3.4vw,20px);padding:0 var(--dp);max-height:min(calc(100dvh - 24px),calc(var(--vvh,100dvh) - 24px))}
dialog>h2:first-child{position:sticky;top:0;z-index:3;background:var(--surface);margin:0 calc(-1*var(--dp));padding:var(--dp) var(--dp) 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
dialog>.row:last-child{position:sticky;bottom:0;z-index:3;background:var(--surface);margin:12px calc(-1*var(--dp)) 0!important;padding:10px var(--dp) calc(10px + var(--sab));border-top:1px solid var(--line)}
dialog>p:first-child{margin-top:var(--dp)}
body:has(dialog[open]){overflow:hidden}
@media(max-width:640px){
 dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;border-bottom:0;max-height:min(92dvh,calc(var(--vvh,100dvh) - var(--sat) - 8px))}
 dialog[open]{animation:sheet .22s ease-out}
 dialog .row:last-child .btn{flex:1 1 0}
}
@keyframes sheet{from{transform:translateY(28px);opacity:.5}}
@media(prefers-reduced-motion:reduce){dialog[open]{animation:none}}
/* --- Tabelas genéricas -> cards no celular (rótulos via data-l) --- */
@media(max-width:640px){
 .card.wrap.rt-w{background:none;border:0;padding:0;overflow:visible}
 table.rt,table.rt tbody{display:block;width:100%;overflow:visible}
 table.rt tr.rt-h{display:none}
 table.rt tr{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin-bottom:10px}
 table.rt td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);text-align:right;min-width:0;overflow-wrap:anywhere}
 table.rt td:last-child{border-bottom:0}
 table.rt td[data-l]::before{content:attr(data-l);color:var(--mute);font-size:13px;text-align:left;flex:none;max-width:42%}
 table.rt td:not([data-l]){justify-content:flex-start;text-align:left}
 table.rt td .row{flex-wrap:wrap!important;justify-content:flex-end;width:100%}
 table.rt td .btn,table.rt td select,table.rt td label.btn{flex:1 1 auto;min-height:var(--tap);text-align:center}
 table.rt td.empty{display:block;text-align:center}
 .flt>summary{display:flex;align-items:center;justify-content:center;width:100%;min-height:var(--tap);margin-bottom:8px}
 .flt:not([open])>summary{margin-bottom:0}
 .flt-b{padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
 .flt-b select{flex:1 1 100%}.flt-b .btn{flex:1 1 calc(50% - 4px)}
 .top>.row{width:100%}.top>.row>.btn{flex:1 1 auto}
}
/* --- Toque confortável (~44px) em dispositivos touch --- */
@media(pointer:coarse){
 .btn,.btn.sm,.pill,.tabs button{min-height:var(--tap)}
 input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=file]),select,textarea{min-height:var(--tap)}
 input[type=checkbox],input[type=radio]{width:24px!important;height:24px;min-height:0;flex:none}
 .tag[onclick],.tg-btn{display:inline-flex;align-items:center;min-height:40px;padding:0 14px}
 .bottom a{min-height:52px;justify-content:center}
 .dc-eye{min-width:var(--tap);min-height:var(--tap)}
 select.av-sel{max-width:none;min-height:var(--tap)}
}
/* --- Performance de renderização --- */
.pm{content-visibility:auto;contain-intrinsic-size:auto 190px}
@media(max-width:374px){.pc-n{font-size:17px}.tc-v{font-size:20px}.mn-g{grid-template-columns:1fr 1fr}}

input[type=color]{min-height:var(--tap);padding:3px;cursor:pointer}
/* escudos: sem fundo, sem caixa; só o brasão, com encaixe uniforme */
img.sh{background:none!important;border:0;box-shadow:none;object-fit:contain;object-position:center;flex:none}
img.sh:not(.shk){opacity:0}
img.sh.shk{opacity:1}
.nx-vs img.sh,.sx-vs img.sh{filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}

/* =====================================================================
   MOBILE COMPACTO — confrontos lado a lado: [ESCUDO] TIME A  ×/placar  TIME B [ESCUDO]
   Somente apresentação (CSS + marcação visual). Desktop (>640px) intacto.
   ===================================================================== */
.cm-d{display:contents}.cm-m{display:none}
@media(max-width:640px){
/* nome do time: no máx. 2 linhas, sem quebrar letra a letra */
.pm-t b,.sx-vs>div:not(.score) b,.nx-vs>div b,.gk b{overflow-wrap:break-word;word-break:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}

/* Partidas */
.pm-list{gap:8px}
.pm{padding:10px 12px;gap:8px}
.pm-top{gap:2px 10px;font-size:12px;line-height:1.25}
.pm-vs{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px}
.pm-t,.pm-t.r{flex-direction:row;gap:6px;width:auto;justify-content:flex-start;text-align:left}
.pm-t.r{justify-content:flex-end;text-align:right}
.pm-t b{font-size:clamp(14px,4.3vw,18px);line-height:1.08;letter-spacing:.02em;text-align:inherit}
.pm-sh{width:auto;flex:none;display:flex}
.pm-sh>*{width:30px!important;height:34px!important}
.pm-mid{font-size:clamp(22px,7vw,28px)}
.pm-mid i{font-size:.75em;margin:0 5px}.pm-mid.x i{margin:0}
.pm-ft{padding-top:8px;gap:4px 10px;font-size:13px}
.pm-ft .btn.sm{flex:none;margin-left:auto;order:0;min-height:36px;padding:4px 10px}

/* Dashboard: Último resultado */
.sx-vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;justify-content:stretch;gap:0;margin:12px 0 10px}
.sx-vs>div:not(.score){display:flex;align-items:center;gap:5px;min-width:0;text-align:left}
.sx-vs>div:last-child{flex-direction:row-reverse;text-align:right}
.sx-vs>div:not(.score) b{flex:1 1 0;min-width:0;margin-top:0;padding-right:12px;font:700 clamp(14px,4vw,17px)/1.1 var(--fh);text-transform:uppercase;letter-spacing:.02em}
.sx-vs>div:last-child b{padding-right:0;padding-left:12px}
.sx-vs>div>img,.sx-vs>div>.shield{width:34px!important;height:38px!important;flex:none}
.sx-vs .score{margin-top:0;font-size:clamp(24px,7vw,30px);padding:0 12px;white-space:nowrap;text-align:center}.sx-vs .x{margin-top:0}
.sx-meta{line-height:1.45;font-size:13px}.sx-hr{margin:10px 0}.sx-ft{margin-top:10px}

/* Dashboard: Próximo jogo */
.nx-field{margin-top:10px;padding:14px 10px 12px}
.nx-vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;justify-content:stretch;gap:0}
.nx-vs>div{display:flex;align-items:center;gap:5px;min-width:0;text-align:left}
.nx-vs>div:last-child{flex-direction:row-reverse;text-align:right}
.nx-vs>div b{flex:1 1 0;min-width:0;margin-top:0;padding-right:12px;font-size:clamp(14px,4.2vw,17px)}
.nx-vs>div:last-child b{padding-right:0;padding-left:12px}
.nx-vs>div>img,.nx-vs>div>.shield{width:36px!important;height:41px!important;flex:none}
.nx-vs .x{margin-top:0;font-size:24px;padding:0 14px;white-space:nowrap;text-align:center}
.nx-meta{margin-top:10px;padding:6px 12px;gap:2px 16px;font-size:13px}
.nx-conv{margin-top:10px;padding:10px 12px}

/* Detalhe da partida (cabeçalho .pitch) */
.pitch{padding:12px 14px}
.pitch>.row{flex-wrap:nowrap;gap:8px!important;justify-content:space-between;margin:4px 0}
.pitch>.row>.vs{flex:1 1 0;min-width:0;gap:6px!important;font-size:clamp(15px,4.4vw,19px);line-height:1.1;text-transform:uppercase;overflow-wrap:break-word}
.pitch>.row>.vs:last-child{flex-direction:row-reverse;text-align:right}
.pitch>.row>.vs>img,.pitch>.row>.vs>.shield{width:30px!important;height:34px!important;flex:none}
.pitch>.row>.score{flex:none;font-size:clamp(26px,8vw,34px)}

/* Súmula: [ESCUDO] TIME [-] 0 [+]  ×  [+] 2 [-] TIME [ESCUDO] */
.card:has(>.vsrow){padding:10px 12px}
.vsrow{flex-wrap:nowrap!important;gap:6px;justify-content:space-between;align-items:center}
.vsrow>div:first-child,.vsrow>div:last-child{flex:none;display:flex}
.vsrow>div:first-child>*,.vsrow>div:last-child>*{width:30px!important;height:34px!important}
.gk-w{flex:1 1 0;min-width:0;flex-wrap:nowrap;gap:2px;align-items:flex-end}
.gk{flex:1 1 0;min-width:0}
.gk b{font:700 clamp(13px,3.8vw,16px)/1.1 var(--fh);text-transform:uppercase;letter-spacing:.02em}
.gk-c{gap:4px;margin-top:4px}
.gk-b{min-width:34px;width:34px;height:34px;min-height:34px;font-size:20px;padding:0}
.gk-c .score{font-size:clamp(26px,8vw,34px);min-width:.65em;text-align:center}
.gk-w>.x{font-size:20px!important;align-self:flex-end;margin-bottom:5px;flex:none}

/* Calendário: célula resumida  03 / 15:30 / vs VILA */
.cal div{min-height:64px;padding:3px 2px;text-align:center;font-size:12px}
.cal div>b{display:inline-block;font:700 13px/1.2 var(--fh)}
.cal .today>b{padding:0 6px}
.cal .chip{margin-top:2px;padding:1px 2px;font-size:10px;line-height:1.15;text-align:center}
.cal .chip .cm-d{display:none}.cal .chip .cm-m{display:block}
.cm-t{display:block;font-weight:700;font-size:10.5px;overflow:hidden;text-overflow:ellipsis}
.cm-o{display:block;font-size:9.5px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Agenda do mês */
.grid.g2:has(>.mcard){gap:8px}
.mcard{flex-wrap:nowrap;gap:10px;padding:10px 12px;align-items:center}
.mcard>div:first-child{min-width:40px!important;flex:none}
.mcard>.sp>b{display:block;font:700 17px/1.15 var(--fh);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:break-word}
.mcard>.sp>.mute{font-size:12.5px!important;line-height:1.3}
.mcard>.tag{flex:none}

/* Campanha: partidas da campanha */
.cp-m{padding:10px 12px;gap:4px 12px}
.cp-mi{flex:1 1 100%;flex-direction:row;align-items:center;gap:8px}
.cp-mt{font-size:15px;line-height:1.2}

/* Campeonatos: jogos da tabela */
.ev:has(>.score){gap:6px;font-size:14px}
.ev>.score{font-size:20px!important;padding:0 4px!important}
}
@media(max-width:359px){
.gk-b{min-width:30px;width:30px;height:30px;min-height:30px;font-size:18px}
.sx-vs>div:not(.score) b,.nx-vs>div b{padding-right:8px}.sx-vs>div:last-child b,.nx-vs>div:last-child b{padding-right:0;padding-left:8px}
.sx-vs .score{padding:0 8px}.nx-vs .x{padding:0 10px}
.cal .chip{font-size:9px}.cm-t{font-size:9.5px}.cm-o{font-size:8.5px}
}

/* autenticação Supabase */

.cm-auth-card h1{font-size:25px;margin-bottom:4px}.cm-auth-card p{margin:0 0 16px;color:#5e7267}

.cm-user-menu>summary::-webkit-details-marker{display:none}
.cm-user-avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);font-weight:800;flex:none}
.cm-user-copy{min-width:0;flex:1}.cm-user-name{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cm-account-email{display:block;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.cm-user-pop{display:grid;gap:6px;margin-top:7px;padding:7px;background:var(--brand);border:1px solid rgba(255,255,255,.25);border-radius:10px}
.cm-user-pop .btn{width:100%;text-align:left;justify-content:flex-start;color:#fff;border-color:rgba(255,255,255,.28)}
.cm-recent{display:grid;gap:6px;margin:0 0 14px}.cm-recent:empty{display:none}

.cm-recent-btn{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:1px solid #dce5df;border-radius:10px;background:#f8faf8;color:#14231c;text-align:left;cursor:pointer}
.cm-recent-btn:hover{background:#eef5f0}.cm-recent-dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#dcefe3;font-weight:800;color:#1f6b4a;flex:none}.cm-recent-btn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:520px){.cm-auth-actions{grid-template-columns:1fr}}

<script>
const ICONS={dashboard:'<path d="M3 3h8v10H3zM13 3h8v6h-8zM13 11h8v10h-8zM3 15h8v6H3z"/>',partidas:'<circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/>',competicoes:'<path d="M7 4h10v5a5 5 0 01-10 0zM5 5H3v2a3 3 0 003 3M19 5h2v2a3 3 0 01-3 3M12 14v4M8 21h8"/>',elenco:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3 3 0 010 6M22 20c0-3-2-5-4-5.5"/>',campanha:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',estatisticas:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',ranking:'<circle cx="12" cy="9" r="5"/><path d="M8.5 13.5L7 21l5-3 5 3-1.5-7.5"/>',calendario:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',financeiro:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9c-.6-1-1.700-1.500-2.700-1.300-1.400.3-2 1.800-.8 2.700 1 .7 2.500.8 3.200 1.800.8 1.300-.3 2.700-1.800 2.800-1.100.1-2.200-.4-2.800-1.400M12 6v2M12 16v2"/>',patrocinadores:'<path d="M3 9l9-5 9 5-9 5zM6 12v5l6 3 6-3v-5"/>',contratos:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/>',documentos:'<path d="M3 6a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',config:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',mais:'<circle cx="5" cy="12" r="1.500"/><circle cx="12" cy="12" r="1.500"/><circle cx="19" cy="12" r="1.500"/>'};

 if(val)S.oppLogos[k]=val;else delete S.oppLogos[k];
 if(save())return true;
 if(prev)S.oppLogos[k]=prev;else delete S.oppLogos[k];return false}

 const pl=[[1,'Rafael Souza','Rafa','Goleiro',1,'Ativo'],[2,'Thiago Alves','Thiago','Lateral direito',2,'Ativo'],[3,'Marcos Pereira','Marcão','Zagueiro',3,'Ativo'],[4,'Diego Lima','Diguinho','Zagueiro',4,'Ativo'],[5,'Lucas Martins','Luquinhas','Volante',5,'Ativo'],[6,'Bruno Costa','Bruno','Lateral esquerdo',6,'Ativo'],[7,'Vitor Santos','Vitinho','Ponta direita',7,'Ativo'],[8,'Felipe Rocha','Felipe','Meia',8,'Ativo'],[9,'André Barros','Dedé','Atacante',9,'Ativo'],[10,'Gustavo Nunes','Guga','Meia',10,'Ativo'],[11,'Caio Ferreira','Caio','Atacante',11,'Ativo'],[12,'João Teixeira','Joãozinho','Goleiro',12,'Reserva'],[14,'Renan Duarte','Renan','Zagueiro',14,'Lesionado'],[15,'Paulo Menezes','Paulinho','Meia',15,'Suspenso']]

/* Migração segura Posição <- Status. Só age em jogador cujo status NÃO é um status de disponibilidade conhecido
   e que parece o nome de uma posição. Copia o valor para `pos` (sem sobrescrever pos já válida), reaproveita o valor
   existente em S.lists.pos (ignora acento/caixa/gênero: direita=direito) ou o acrescenta a essa mesma lista,
   registra o valor original em S.posMig e só então define status 'Ativo'. Nada é apagado. */

const ST_OK=['Ativo','Reserva','Lesionado','Suspenso','Afastado','Inativo'];

const cpSort=(a,b)=>(a.date+' '+(a.time||'')).localeCompare(b.date+' '+(b.time||''));
const cpDate=m=>(!fl.cpY||m.date.slice(0,4)===fl.cpY)&&(!fl.cpFrom||m.date>=fl.cpFrom)&&(!fl.cpTo||m.date<=fl.cpTo);

function campanha(){
 const cpm=can('partidas'),cpj=can('estatisticas')||can('elenco'),DN=done();
 /* filtros: valores que deixaram de existir (competição renomeada/removida) voltam para "todas" */

  comps=[...new Set([...S.lists.comps,...S.matches.map(m=>m.comp)].filter(Boolean))],hasNone=S.matches.some(m=>!m.comp);

 const ms=cpMs(),SC=new Map(ms.map(m=>[m.id,score(m)])),T=seasonSummary(ms),n=ms.length,
  pts=T.v*3+T.e,pos=T.j*3,aprTxt=n?Math.round(pts/pos*100)+'%':'—';
 const sg=x=>(x>0?'+':'')+x,sgc=x=>x>0?'pos':x<0?'neg':'',
  cnt=t=>ms.reduce((a,m)=>a+evs(m.id).filter(e=>e.t===t).length,0),cy=cnt('amarelo'),cr=cnt('vermelho');

 const filtros=`<div class="row" style="margin-bottom:12px;gap:8px">${sel('cpY','Todas as temporadas',yrs.map(y=>[y,y]))}${sel('cpC','Todas as competições',[...comps.map(c=>[c,c]),...(hasNone?[['__none','Amistosos (sem competição)']]:[])])}<span class="row" style="gap:6px;max-width:100%"><small class="mute">Período</small><input type="date" style="width:auto" value="${fl.cpFrom||''}" onchange="fl.cpFrom=this.value;render()" aria-label="Período: início"><span class="mute">→</span><input type="date" style="width:auto" value="${fl.cpTo||''}" onchange="fl.cpTo=this.value;render()" aria-label="Período: fim"></span>${clr('cpY','cpC','cpFrom','cpTo')}</div>`;
 const H=t=>`<h2 class="cp-h">${t}</h2>`;

 /* DESEMPENHO RECENTE — últimos 5 encerrados do recorte, mais recente à esquerda */

/* ===== Escudos: transparência real e exibição padronizada =====
   Causa do "retângulo preto": o arquivo do escudo chega com um fundo sólido gravado nos próprios pixels
   (preto/branco opaco, ou JPEG de fundo escuro). CSS não resolve isso; é preciso recortar o fundo.
   shCanvas(): se os 4 cantos forem opacos e de cor uniforme, apaga esse fundo por preenchimento a partir das bordas
   (só o fundo conectado às bordas; pretos internos do brasão são preservados), suaviza a borda e apara as margens vazias. */
function shCanvas(c){
 try{const W=c.width,H=c.height;if(W<8||H<8)return c;const g=c.getContext('2d',{willReadFrequently:true}),id=g.getImageData(0,0,W,H),d=id.data;
  const px=(x,y)=>{const i=(y*W+x)*4;return[d[i],d[i+1],d[i+2],d[i+3]]};
  const cn=[px(0,0),px(W-1,0),px(0,H-1),px(W-1,H-1)];let changed=false;
  if(cn.every(p=>p[3]>=230)){const bg=[0,1,2].map(k=>Math.round(cn.reduce((a,p)=>a+p[k],0)/4));
   const df=(i)=>Math.max(Math.abs(d[i]-bg[0]),Math.abs(d[i+1]-bg[1]),Math.abs(d[i+2]-bg[2]));
   /* só fundos escuros (preto/quase preto): fundo claro pode ser parte do brasão (faixas brancas) e não é tocado */
   if(Math.max(bg[0],bg[1],bg[2])<=80&&cn.every(p=>Math.max(Math.abs(p[0]-bg[0]),Math.abs(p[1]-bg[1]),Math.abs(p[2]-bg[2]))<=48)){
    const T1=34,T2=78,seen=new Uint8Array(W*H),st=new Int32Array(W*H);let sp=0,rem=0;const out=[];
    const push=(x,y)=>{const k=y*W+x;if(seen[k])return;seen[k]=1;const i=k*4;if(d[i+3]<16||df(i)<=T1){st[sp++]=k}else if(df(i)<=T2)out.push(k)};
    for(let x=0;x<W;x++){push(x,0);push(x,H-1)}for(let y=0;y<H;y++){push(0,y);push(W-1,y)}
    while(sp){const k=st[--sp],x=k%W,y=(k-x)/W,i=k*4;d[i+3]=0;rem++;
     if(x>0)push(x-1,y);if(x<W-1)push(x+1,y);if(y>0)push(x,y-1);if(y<H-1)push(x,y+1)}
    /* borda suave: pixels de transição ganham alfa proporcional e perdem o "respingo" da cor do fundo */
    out.forEach(k=>{const i=k*4,a=Math.max(0,Math.min(1,(df(i)-T1)/(T2-T1)));if(a>=1)return;
     for(let q=0;q<3;q++)d[i+q]=Math.max(0,Math.min(255,Math.round((d[i+q]-(1-a)*bg[q])/Math.max(a,.15))));d[i+3]=Math.round(d[i+3]*a)});
    const fr=rem/(W*H);
    if(fr>=.004&&fr<=.92){g.putImageData(id,0,0);changed=true}}}
  /* apara margens transparentes (encaixe padronizado) */
  const id2=changed?id:g.getImageData(0,0,W,H),e=id2.data;let x0=W,y0=H,x1=-1,y1=-1;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(e[(y*W+x)*4+3]>12){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0)return c;
  if(!changed&&(x1-x0+1)*(y1-y0+1)>=.94*W*H)return c;
  const w=x1-x0+1,h=y1-y0+1,n=document.createElement('canvas');n.width=w;n.height=h;n.getContext('2d').drawImage(c,x0,y0,w,h,0,0,w,h);return n
 }catch(_){return c}}

function qeStart(){const L=sortOrd(roster());fl.qe={order:L.map(p=>p.id),nums:Object.fromEntries(L.map(p=>[p.id,String(p.num)]))};fl.elEdit=true;render()}

function qeSave(){const q=fl.qe;if(!q)return qeCancel();const ps=q.order.map(id=>P(id)).filter(Boolean),old=ps.map(p=>({p,num:p.num,ordem:p.ordem}));
 ps.forEach((p,i)=>{p.ordem=i;p.num=+q.nums[p.id]||0});
 if(!save()){old.forEach(o=>{o.p.num=o.num;if(o.ordem===undefined)delete o.p.ordem;else o.p.ordem=o.ordem});return note('Não consegui salvar as alterações (armazenamento do navegador cheio?). Nada foi alterado.')}
 fl.elEdit=false;fl.qe=null;render();toast('Alterações salvas.')}
function qeMoveId(id,to){const o=fl.qe.order.filter(x=>x!==id);o.splice(Math.max(0,Math.min(o.length,to)),0,id);fl.qe.order=o}
function qeKey(e,id){if(e.key!=='ArrowUp'&&e.key!=='ArrowDown')return;e.preventDefault();const i=fl.qe.order.indexOf(id);qeMoveId(id,i+(e.key==='ArrowUp'?-1:1));render();const h=document.querySelector('[data-h="'+id+'"]');if(h)h.focus()}
let QD=null;
function qeDown(e,id){if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();const row=e.currentTarget.closest('.qe-row');QD={id,row,tgt:null,after:false};row.classList.add('drag');document.body.classList.add('qe-drag');
 document.addEventListener('pointermove',qeMv);document.addEventListener('pointerup',qeUp);document.addEventListener('pointercancel',qeEnd)}
function qeMv(e){if(!QD)return;const rows=[...document.querySelectorAll('.qe-row')];if(!rows.length)return;rows.forEach(r=>r.classList.remove('dt','db'));
 let t=rows.find(r=>{const b=r.getBoundingClientRect();return e.clientY>=b.top&&e.clientY<=b.bottom});
 if(!t)t=e.clientY<rows[0].getBoundingClientRect().top?rows[0]:rows[rows.length-1];
 const b=t.getBoundingClientRect();QD.tgt=t;QD.after=e.clientY>b.top+b.height/2;if(t!==QD.row)t.classList.add(QD.after?'db':'dt');
 if(e.clientY<90)window.scrollBy(0,-14);else if(e.clientY>innerHeight-120)window.scrollBy(0,14)}
function qeEnd(){document.removeEventListener('pointermove',qeMv);document.removeEventListener('pointerup',qeUp);document.removeEventListener('pointercancel',qeEnd);document.body.classList.remove('qe-drag');document.querySelectorAll('.qe-row').forEach(r=>r.classList.remove('drag','dt','db'));QD=null}
function qeUp(){const d=QD;qeEnd();if(!d||!d.tgt||d.tgt===d.row)return;const o=fl.qe.order.filter(x=>x!==d.id),i=o.indexOf(+d.tgt.dataset.id);o.splice(d.after?i+1:i,0,d.id);fl.qe.order=o;render()}
function qeView(tb){if(!fl.qe)qeStart();const q=fl.qe,btns=`<div class="row" style="justify-content:flex-end;gap:8px"><button class="btn ghost" onclick="qeCancel()">Cancelar</button><button class="btn" onclick="qeSave()">Salvar alterações</button></div>`;
 return head('Elenco','')+tb+`<div class="card" style="padding:0"><div style="padding:12px 14px"><h3 style="margin:0">EDIÇÃO RÁPIDA</h3><div class="mute" style="font-size:13px;margin:6px 0 10px">✓ Editar números das camisas<br>↕ Organizar jogadores: arraste pela alça ☰ (ou use as setas ↑ ↓ com a alça focada)</div>${btns}</div>${q.order.map(id=>P(id)).filter(Boolean).map(p=>`<div class="qe-row" data-id="${p.id}"><span class="qe-h" data-h="${p.id}" role="button" tabindex="0" aria-label="Arrastar ${esc(p.nome)} para reordenar" onpointerdown="qeDown(event,${p.id})" onkeydown="qeKey(event,${p.id})">☰</span><input class="qe-n" type="number" step="any" inputmode="numeric" aria-label="Número da camisa de ${esc(p.nome)}" value="${esc(q.nums[p.id])}" oninput="fl.qe.nums[${p.id}]=this.value"><b class="sp" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.nome)}</b>${p.pos?`<span class="tag" style="text-transform:uppercase;white-space:nowrap">${esc(p.pos)}</span>`:'<span class="mute">—</span>'}</div>`).join('')}<div style="padding:12px 14px">${btns}</div></div>`}

function paCard(m){
 const fin=m.status==='encerrado',sc=fin?score(m):null,cost=fin?mcost(m.id):0;

function partidas(){
 if(sub==='det')return matchDetail();
 const base=S.matches.filter(m=>(!fl.paT||m.type===fl.paT)&&(!fl.paC||m.comp===fl.paC)&&(!fl.paM||(fl.paM==='Neutro'?!!m.neutral:fl.paM==='Casa'?(m.home&&!m.neutral):(!m.home&&!m.neutral)))&&(!fl.paS||m.status===fl.paS));
 const up=base.filter(m=>m.status!=='encerrado').sort((a,b)=>paKey(a).localeCompare(paKey(b)));
 const dn=base.filter(m=>m.status==='encerrado').sort((a,b)=>paKey(b).localeCompare(paKey(a)));
 const tab=fl.paTab||'',sec=(t,arr)=>arr.length?`<div class="pm-h">${t}</div><div class="pm-list">${arr.map(paCard).join('')}</div>`:'';

 const nm=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][m-1];

function readLogo(f,ok,fail,M=256,fmt='image/png'){
 if(!f.type.startsWith('image/'))return fail('Escolha um arquivo de imagem (PNG, JPG, WebP ou SVG).');
 if(f.size>8*1024*1024)return fail('Imagem muito grande. Use um arquivo de até 8 MB.');
 const r=new FileReader();r.onerror=()=>fail('Não consegui ler esse arquivo.');
 r.onload=()=>{const im=new Image();im.onerror=()=>fail('Não consegui abrir essa imagem.');
  im.onload=()=>{const k=Math.min(1,M/Math.max(im.width,im.height)||1),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k)),c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');if(fmt==='image/jpeg'){g.fillStyle='#fff';g.fillRect(0,0,w,h)}g.drawImage(im,0,0,w,h);
   ok((fmt==='image/png'?shCanvas(c):c).toDataURL(fmt,.85))};im.src=r.result};r.readAsDataURL(f)}
function setLogo(inp){const f=inp.files&&inp.files[0];if(!f)return;readLogo(f,d=>{S.club.logo=d;if(!save())return note('Não consegui salvar a imagem: o armazenamento do navegador está cheio.');render()},note)}

async function removeStorageTree(bucket,path){
 if(!sb)return;const {data,error}=await sb.storage.from(bucket).list(path,{limit:1000});
 if(error){console.warn('Storage '+bucket+' não pôde ser listado:',error);return}
 const files=[],folders=[];
 (data||[]).forEach(x=>{const p=path+'/'+x.name;if(x.id)files.push(p);else folders.push(p)});
 for(const folder of folders)await removeStorageTree(bucket,folder);
 if(files.length){const {error:rmErr}=await sb.storage.from(bucket).remove(files);if(rmErr)console.warn('Falha ao remover arquivos de '+bucket,rmErr)}
}
async function deleteClubPermanent(){
 if(!isActualAdmin())return note('Somente Presidente ou Vice-presidente podem excluir um clube.');
 if(Object.keys(DB.clubs).length<=1)return note('Você precisa manter pelo menos um clube. Crie outro clube antes de excluir este.');
 const clubId=DB.cur,name=S.club.name;
 try{
  await Promise.all([removeStorageTree('cm-media',clubId),removeStorageTree('cm-documents',clubId)]);
  const {error}=await sb.from('cm_clubs').delete().eq('id',clubId);
  if(error)throw error;
  delete DB.clubs[clubId];_members=_members.filter(m=>m.club_id!==clubId);_clubMembers=[];_permUser='';_userPermDraft=null;_userPermDirty=false;
  DB.cur=Object.keys(DB.clubs)[0];S=DB.clubs[DB.cur];const m=_members.find(x=>x.club_id===DB.cur);_actualRole=m&&m.role?m.role:'Presidente';DB.role=_actualRole;
  try{localStorage.setItem(_cacheKey,JSON.stringify(DB))}catch(e){}
  await cmLoadClubMembers(DB.cur);toast('Clube "'+name+'" excluído com sucesso.');go('dashboard')
 }catch(e){console.error('Falha ao excluir clube:',e);note('Não consegui excluir o clube do banco. Nada foi removido localmente. Tente novamente.')}
}

function delMatch(id){const m=S.matches.find(x=>x.id===id);
 if(m.status==='encerrado')return note('Partidas encerradas fazem parte do histórico esportivo e financeiro. Reabra a partida se realmente precisar excluí-la.');

const FMT=[['pontos_corridos','Pontos corridos'],['mata_mata','Mata-mata'],['grupos_mata_mata','Grupos + mata-mata'],['copa','Copa'],['amistoso','Torneio amistoso']];
const TIEK=[['vitorias','Mais vitórias'],['saldo','Saldo de gols'],['gols_pro','Gols pró'],['gols_contra','Menos gols contra'],['derrotas','Menos derrotas']];
const fmtName=f=>(FMT.find(x=>x[0]===f)||[0,f])[1];
const c_=id=>S.comps.find(x=>x.id===id);
function compGames(c){const g=c.games.map(x=>({...x}));
 S.matches.filter(m=>m.status==='encerrado'&&m.comp===c.name).forEach(m=>{const sc=score(m);g.push(m.home?{round:m.round,home:S.club.name,away:m.opp,hg:sc.gf,ag:sc.ga,own:m.id}:{round:m.round,home:m.opp,away:S.club.name,hg:sc.ga,ag:sc.gf,own:m.id})});return g}
function standings(c){const T={};const t=n=>T[n]=T[n]||{n,j:0,v:0,e:0,d:0,gp:0,gc:0,pts:0};
 c.teams.forEach(x=>t(x.own?S.club.name:x.name));
 compGames(c).forEach(g=>{const a=t(g.home),b=t(g.away);a.j++;b.j++;a.gp+=g.hg;a.gc+=g.ag;b.gp+=g.ag;b.gc+=g.hg;
  if(g.hg>g.ag){a.v++;b.d++;a.pts+=c.pts.w;b.pts+=c.pts.l}else if(g.hg<g.ag){b.v++;a.d++;b.pts+=c.pts.w;a.pts+=c.pts.l}else{a.e++;b.e++;a.pts+=c.pts.d;b.pts+=c.pts.d}});
 const K={pontos:t=>t.pts,vitorias:t=>t.v,saldo:t=>t.gp-t.gc,gols_pro:t=>t.gp,gols_contra:t=>-t.gc,derrotas:t=>-t.d};
 return Object.values(T).map(x=>({...x,sg:x.gp-x.gc})).sort((a,b)=>{for(const k of ['pontos',...c.tie]){const f=K[k];if(!f)continue;const d=f(b)-f(a);if(d)return d}return a.n.localeCompare(b.n)})}
function competicoes(){
 if(sub==='det')return compDetail();
 return head('Competições',`<button class="btn" onclick="addComp()">Nova competição</button>`)+(S.comps.length?`<div class="grid g2">${S.comps.map(c=>{const st=standings(c),me=st.findIndex(x=>x.n===S.club.name)+1;return`<div class="card cursor" onclick="go('competicoes','det',{id:${c.id}})"><span class="tag">${fmtName(c.format)}</span><h3 style="margin-top:6px">${esc(c.name)}</h3><div class="mute">${st.length} times · ${c.rounds||'—'} rodadas${me&&c.format!=='mata_mata'?' · '+esc(S.club.name)+' em '+me+'º':''}</div></div>`}).join('')}</div>`:`<div class="card empty"><h3>Nenhuma competição</h3><p>Crie a primeira para acompanhar a tabela.</p></div>`)}
function compDetail(){
 const c=c_(ctx.id);if(!c)return head('Competição não encontrada',`<button class="btn ghost sm" onclick="go('competicoes')">Voltar</button>`);
 const lg=c.format!=='mata_mata',tab=ctx.tab||(lg?'tab':'jogos');
 const TB=[...(lg?[['tab','Tabela']]:[]),['jogos',lg?'Jogos':'Chaveamento'],['regras','Regras e times']];
 let b='';
 if(tab==='tab'){const st=standings(c);
  b=`<div class="card wrap"><table class="tbl"><tr><th>#</th><th>Time</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th></tr>${st.map((t,i)=>`<tr ${t.n===S.club.name?'style="background:var(--soft)"':''}><td><b>${i+1}</b></td><td>${esc(t.n)}</td><td><b>${t.pts}</b></td><td>${t.j}</td><td>${t.v}</td><td>${t.e}</td><td>${t.d}</td><td>${t.gp}</td><td>${t.gc}</td><td>${t.sg}</td></tr>`).join('')}</table></div><p class="mute">Desempate: pontos${c.tie.map(k=>', '+(TIEK.find(x=>x[0]===k)||[0,k])[1].toLowerCase()).join('')}.</p>`}
 if(tab==='jogos'){const g=compGames(c).sort((a,b)=>a.round-b.round),rs=[...new Set(g.map(x=>x.round))];
  b=`<div class="row" style="margin-bottom:8px"><button class="btn sm" onclick="addGame(${c.id})">Adicionar jogo</button><span class="mute">Jogos do seu clube vêm de Partidas.</span></div>`+(rs.map(r=>`<div class="card" style="margin-bottom:10px"><b>${lg?'Rodada':'Fase'} ${r}</b>${g.filter(x=>x.round===r).map(x=>`<div class="ev"><span class="sp" style="text-align:right">${esc(x.home)}</span><b class="score" style="font-size:24px;padding:0 8px">${x.hg} × ${x.ag}</b><span class="sp">${esc(x.away)}</span>${x.own?`<span class="tag">Do clube</span>`:`<button class="btn ghost sm" onclick="delGame(${c.id},${x.id})">Remover</button>`}</div>`).join('')}</div>`).join('')||'<div class="card empty">Nenhum jogo registrado.</div>')}
 if(tab==='regras'){const names=standings(c).map(x=>x.n),rest=TIEK.filter(x=>!c.tie.includes(x[0]));
  b=`<div class="grid g2"><div class="card"><h3>Regras</h3><label>Nome</label><input value="${esc(c.name)}" onchange="renameComp(${c.id},this.value)"><label>Formato</label><select onchange="c_(${c.id}).format=this.value;save();render()">${FMT.map(f=>`<option value="${f[0]}" ${c.format===f[0]?'selected':''}>${f[1]}</option>`).join('')}</select><label>Rodadas</label><input type="number" style="width:100%" value="${c.rounds||''}" onchange="c_(${c.id}).rounds=+this.value;save()"><label>Pontos por vitória, empate e derrota</label><div class="row">${['w','d','l'].map(k=>`<input type="number" value="${c.pts[k]}" onchange="c_(${c.id}).pts['${k}']=+this.value;save();render()">`).join('')}</div>
  <h3 style="margin-top:14px">Critérios de desempate</h3><p class="mute">Depois dos pontos, nesta ordem.</p>${c.tie.map((k,i)=>`<div class="row" style="padding:4px 0"><span class="sp">${i+1}. ${(TIEK.find(x=>x[0]===k)||[0,k])[1]}</span><button class="btn ghost sm" onclick="tieMove(${c.id},${i},-1)">Subir</button><button class="btn ghost sm" onclick="tieMove(${c.id},${i},1)">Descer</button><button class="btn ghost sm" onclick="tieDel(${c.id},${i})">Remover</button></div>`).join('')||'<div class="mute">Sem critérios extras.</div>'}${rest.length?`<select style="margin-top:8px" onchange="tieAdd(${c.id},this.value)"><option value="">Adicionar critério…</option>${rest.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select>`:''}</div>
  <div class="card"><h3>Times</h3>${names.map(n=>{const t=c.teams.find(x=>!x.own&&x.name===n);return`<div class="row" style="padding:5px 0"><span class="sp">${esc(n)}</span>${n===S.club.name?'<span class="tag ok">Seu clube</span>':t?`<button class="btn ghost sm" onclick="delTeam(${c.id},${t.id})">Remover</button>`:'<span class="tag">Das partidas</span>'}</div>`}).join('')}<button class="btn sm" style="margin-top:8px" onclick="addTeam(${c.id})">Adicionar time</button></div></div><div style="margin-top:14px"><button class="btn ghost" onclick="delComp(${c.id})">Excluir competição</button></div>`}
 return `<div class="top"><button class="btn ghost sm" onclick="go('competicoes')">Voltar</button><span class="tag">${fmtName(c.format)}</span></div><h1 style="margin-bottom:10px">${esc(c.name)}</h1>${tabs(TB,tab,'ctab')}${b}`}
const ctab=k=>{ctx.tab=k;render()};
function addComp(){modal('Nova competição',[{k:'name',l:'Nome'},{k:'format',l:'Formato',t:'sel',o:FMT},{k:'rounds',l:'Quantidade de rodadas',t:'number'}],v=>{if(!v.name)return'Informe o nome.';const id=nid();S.comps.push({id,name:v.name,format:v.format,rounds:+v.rounds||0,pts:{w:3,d:1,l:0},tie:['vitorias','saldo','gols_pro'],teams:[{id:nid(),name:'',own:true}],games:[]});if(!S.lists.comps.includes(v.name))S.lists.comps.push(v.name);save();go('competicoes','det',{id})})}
function renameComp(id,v){const c=c_(id),old=c.name;if(!v.trim())return render();c.name=v.trim();S.matches.forEach(m=>{if(m.comp===old)m.comp=c.name});S.lists.comps=S.lists.comps.map(x=>x===old?c.name:x);save();render()}
function addTeam(id){modal('Novo time',[{k:'name',l:'Nome do time'}],v=>{if(!v.name)return'Informe o nome.';c_(id).teams.push({id:nid(),name:v.name});save();render()})}
function delTeam(cid,tid){const c=c_(cid),t=c.teams.find(x=>x.id===tid);if(c.games.some(g=>g.home===t.name||g.away===t.name))return note('Este time tem jogos registrados. Remova os jogos primeiro.');ask('Remover '+esc(t.name)+' da competição?',()=>{c.teams=c.teams.filter(x=>x.id!==tid);save();render()})}
function addGame(id){const c=c_(id),n=standings(c).map(x=>x.n);modal('Adicionar jogo',[{k:'round',l:'Rodada ou fase',t:'number',v:1},{k:'home',l:'Mandante',t:'sel',o:n},{k:'away',l:'Visitante',t:'sel',o:n},{k:'hg',l:'Gols do mandante',t:'number',v:0},{k:'ag',l:'Gols do visitante',t:'number',v:0}],v=>{if(v.home===v.away)return'Escolha dois times diferentes.';c.games.push({id:nid(),round:+v.round||1,home:v.home,away:v.away,hg:+v.hg||0,ag:+v.ag||0});save();render()})}

 /* "Ver" dentro da validação: guarda o rascunho, abre o visualizador existente e volta para a validação ao fechar */
 d.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{_vd=rd();try{viewDoc(+b.dataset.v)}catch(e){}const m=$('#mdone');if(m)m.onclick=()=>d.close();d.onclose=()=>{d.onclose=null;d.style.width='';valDoc(pid)}})}
const delDoc=id=>ask('Remover este documento?',()=>{S.docs=S.docs.filter(d=>d.id!==id);save();render()});

/* modal genérico */
const logoField=f=>`<div class="row" style="gap:12px;align-items:center"><div id="f_${f.k}_pv" style="width:48px;flex:none"></div><div><input id="f_${f.k}" type="file" accept="image/*" style="padding:6px"><button type="button" class="btn ghost sm" id="f_${f.k}_rm" style="margin-top:6px">${f.rm||'Remover logo'}</button></div></div>`;
function modal(title,fields,onSave){
 const d=$('#dlg');
 d.innerHTML=`<h2>${title}</h2>${fields.map(f=>`<label>${f.l}</label>${f.t==='logo'?logoField(f):f.t==='sel'?`<select id="f_${f.k}">${f.o.map(o=>Array.isArray(o)?`<option value="${o[0]}" ${String(o[0])===String(f.v??'')?'selected':''}>${o[1]}</option>`:`<option ${o===f.v?'selected':''}>${o}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" ${f.t==='number'?'step="any" inputmode="decimal" style="width:100%"':''} value="${f.v??''}">`}`).join('')}<div id="err" class="neg" style="margin-top:8px"></div><div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost" id="cx">Cancelar</button><button class="btn" id="ok">Salvar</button></div>`;
 const LG={};fields.filter(f=>f.t==='logo').forEach(f=>{const nm=()=>{const o=$('#f_'+(f.of||'opp'));return o?o.value:''};
  const pv=()=>{const n=nm(),cur=LG[f.k]===undefined?(f.prev?f.cur:oppLogoOf(n)):LG[f.k];$('#f_'+f.k+'_pv').innerHTML=f.prev?f.prev(cur):oppImg(cur,n,48,56)};
  $('#f_'+f.k).onchange=e=>{const fl=e.target.files&&e.target.files[0];if(!fl)return;readLogo(fl,d=>{LG[f.k]=d;$('#err').textContent='';pv()},m=>{$('#err').textContent=m;e.target.value=''},f.m||160,f.fmt)};
  $('#f_'+f.k+'_rm').onclick=()=>{LG[f.k]='';$('#f_'+f.k).value='';pv()};
  const o=$('#f_'+(f.of||'opp'));if(o)o.oninput=pv;pv()});
 d.showModal();$('#cx').onclick=()=>d.close();
 fields.filter(f=>f.mask==='cpf').forEach(f=>{const i=$('#f_'+f.k);if(i){i.inputMode='numeric';i.autocomplete='off';i.oninput=()=>{i.value=maskCpfIn(i.value)}}});
 $('#ok').onclick=()=>{const v={};fields.forEach(f=>v[f.k]=f.t==='logo'?LG[f.k]:$('#f_'+f.k).value);const e=onSave(v);if(e){$('#err').textContent=e;return}d.close()}}

if(window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.dataset.theme='dark';
render();
</script>
